<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Login | Stuphie Ltd</title>
  <link rel="stylesheet" href="/static/cloud.css">

  <meta name="theme-color" content="#070708">
  <meta name="application-name" content="STUPHIE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="STUPHIE">

  <link
    rel="manifest"
    href="/static/stuphie-manifest.webmanifest?v=2">

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/static/images/stuphie-apple-touch.png?v=2">

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="/static/images/stuphie-app-192.png?v=2">

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="/static/images/stuphie-app-512.png?v=2">

</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand-link" href="/">Stuphie Ltd</a>
    <p class="eyebrow">Sophie's Photography</p>
    <h1>Staff sign in</h1>
    <p class="muted">Secure access for authorised staff only.</p>
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/staff/login" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Email
        <input type="email" name="email" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <a class="text-link" href="/staff/forgot-password">Forgot password?</a>
      <button type="submit">Sign in</button>
    </form>
    <a class="text-link" href="/">Return to home</a>
  </main>
</body>
</html>
