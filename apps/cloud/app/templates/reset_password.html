<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Stuphie Online</title>
  <link rel="stylesheet" href="/static/cloud.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand-link" href="/">Stuphie Online</a>
    <p class="eyebrow">Sophie’s Photography</p>
    <h1>Choose a new password</h1>
    <p class="muted">
      Use at least 12 characters.
    </p>

    {% if error %}
      <div class="alert" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post"
          action="/staff/reset-password/{{ raw_token }}"
          class="auth-form">

      <input type="hidden"
             name="csrf_token"
             value="{{ csrf_token }}">

      <label>New password
        <input type="password"
               name="password"
               autocomplete="new-password"
               minlength="12"
               required
               autofocus>
      </label>

      <label>Confirm new password
        <input type="password"
               name="password_confirm"
               autocomplete="new-password"
               minlength="12"
               required>
      </label>

      <button type="submit">
        Update password
      </button>
    </form>
  </main>
</body>
</html>
