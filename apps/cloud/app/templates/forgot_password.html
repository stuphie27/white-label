<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | Stuphie Online</title>
  <link rel="stylesheet" href="/static/cloud.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand-link" href="/">Stuphie Online</a>
    <p class="eyebrow">Sophie’s Photography</p>
    <h1>Forgot password?</h1>
    <p class="muted">
      Enter your authorised staff email address.
    </p>

    <form method="post"
          action="/staff/forgot-password"
          class="auth-form">
      <input type="hidden"
             name="csrf_token"
             value="{{ csrf_token }}">

      <label>Email
        <input type="email"
               name="email"
               autocomplete="email"
               required
               autofocus>
      </label>

      <button type="submit">
        Send reset link
      </button>
    </form>

    <a class="text-link" href="/staff/login">
      Return to sign in
    </a>
  </main>
</body>
</html>
